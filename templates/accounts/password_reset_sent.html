{% extends "base.html" %}
{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: auto; padding: 20px; text-align: center;">
    <h2>Check Your Email</h2>
    <p>We've sent you an email with instructions to reset your password.</p>
    <p>If you don't receive the email, please check your spam folder or try again.</p>
    <a href="{% url 'logs_app:login_client' %}" style="color: #007bff;">Return to Login</a>
</div>
{% endblock %}
